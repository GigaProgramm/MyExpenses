{% extends "base.html" %}

{% block content %}
<div class="container auth">
    <h1>Регистрация</h1>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('register') }}">
        <input name="username" placeholder="Логин" autocomplete="username" required>
        <input name="password" type="password" placeholder="Пароль" autocomplete="new-password" required>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <p class="auth-link">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
