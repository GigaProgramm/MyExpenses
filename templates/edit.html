{% extends "base.html" %}

{% block content %}

<div class="container">
    <span class="expense-title">
        {{ expens.title }}
        <span class="expense-date">{{ expens.expens_date.split()[0] }}</span>
    </span>
    <span class="expense-amount">{{ expens.expens_count }} ₽</span>
    <span class="expense-category">{{ expens.category }}</span>
    <h1>Редактирование</h1>
        <form class="expense-form" method="post"
            action="{{ url_for('edit', expens_id=expens.id) }}">
            <input name="title" value="{{ expens.title }}" required>
            <select name="category">
                <option value="">Без категории</option>
                {% for category in all_category %}
                    <option value="{{ category }}" {% if category == expens.category %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
            <input name="expens_date" type="date" value="{{ expens.expens_date.split()[0] if expens.expens_date else '' }}">
            <input name="expens_count" type="number" min="0" step="0.01"
                inputmode="decimal" value="{{ expens.expens_count }}">
            <button type="submit">Изменить</button>
        </form>
</div>

{% endblock %}
